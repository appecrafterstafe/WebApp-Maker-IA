<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI WebApp Studio</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="h-full text-slate-100 flex flex-col overflow-hidden font-sans">

    <!-- BARRA SUPERIOR -->
    <header class="h-14 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-3 shrink-0">
        <div class="flex items-center space-x-2">
            <div class="bg-indigo-600 text-white p-1.5 rounded-lg">
                <i class="fa-solid fa-wand-magic-sparkles text-xs"></i>
            </div>
            <span class="font-bold text-sm bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">AI Studio</span>
        </div>
        <div class="flex items-center space-x-2">
            <select id="provider-select" onchange="saveConfig()" class="bg-slate-950 border border-slate-800 text-[10px] text-slate-300 rounded px-1.5 py-1">
                <option value="groq">Groq (Llama 3.1)</option>
                <option value="openrouter">OpenRouter</option>
            </select>
            <input type="password" id="api-key-input" placeholder="API Key" class="bg-slate-950 border border-slate-800 text-[10px] text-slate-200 px-2 py-1 rounded w-20">
            <button onclick="saveConfig()" class="text-[10px] bg-indigo-600 text-white px-2 py-1 rounded">Guardar</button>
        </div>
    </header>

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="flex-1 flex flex-col overflow-hidden">
        
        <!-- PANELES (Pestañas) -->
        <div class="flex bg-slate-900 border-b border-slate-800 text-xs">
            <button onclick="switchMainTab('chat')" id="tab-btn-chat" class="flex-1 py-2 text-center font-medium bg-indigo-600/20 text-indigo-400 border-b-2 border-indigo-500">Chat IA</button>
            <button onclick="switchMainTab('preview')" id="tab-btn-preview" class="flex-1 py-2 text-center font-medium text-slate-400">Previsualización</button>
            <button onclick="switchMainTab('code')" id="tab-btn-code" class="flex-1 py-2 text-center font-medium text-slate-400">Código</button>
        </div>

        <!-- PANEL CHAT -->
        <div id="panel-chat" class="flex-1 flex flex-col bg-slate-950 overflow-hidden">
            <div id="chat-messages" class="flex-1 p-3 overflow-y-auto space-y-3 text-xs">
                <div class="flex items-start space-x-2">
                    <div class="w-6 h-6 rounded-full bg-indigo-600 flex items-center justify-center text-white shrink-0 text-[10px] font-bold">IA</div>
                    <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl text-slate-300">
                        ¡Hola! Poné tu API Key arriba, guardala, escribime qué app querés hacer y tocá <b>Generar</b>.
                    </div>
                </div>
            </div>
            <div class="p-3 bg-slate-900 border-t border-slate-800 flex gap-2">
                <textarea id="user-input" rows="2" placeholder="Ej: Una app de notas..." class="flex-1 bg-slate-950 border border-slate-700 rounded-lg p-2 text-xs text-slate-200 focus:outline-none resize-none"></textarea>
                <button type="button" id="send-btn" onclick="generateApp()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 rounded-lg text-xs font-medium flex items-center justify-center shrink-0">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>

        <!-- PANEL PREVIEW -->
        <div id="panel-preview" class="flex-1 bg-white hidden">
            <iframe id="preview-frame" class="w-full h-full border-0" srcdoc="<div style='display:flex;height:100vh;align-items:center;justify-content:center;font-family:sans-serif;color:#64748b;font-size:14px;'>Tu webapp aparecerá aquí.</div>"></iframe>
        </div>

        <!-- PANEL CÓDIGO -->
        <div id="panel-code" class="flex-1 bg-slate-900 p-3 font-mono text-[10px] text-slate-300 overflow-y-auto hidden">
            <pre><code id="code-content">&lt;!-- Código fuente --&gt;</code></pre>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const savedKey = localStorage.getItem('ai_key');
            const savedProvider = localStorage.getItem('ai_prov') || 'groq';
            if (savedKey) document.getElementById('api-key-input').value = savedKey;
            document.getElementById('provider-select').value = savedProvider;
        });

        function saveConfig() {
            const key = document.getElementById('api-key-input').value.trim();
            const prov = document.getElementById('provider-select').value;
            if(key) {
                localStorage.setItem('ai_key', key);
                localStorage.setItem('ai_prov', prov);
                alert('¡Guardado!');
            }
        }

        function switchMainTab(tab) {
            const pChat = document.getElementById('panel-chat');
            const pPrev = document.getElementById('panel-preview');
            const pCode = document.getElementById('panel-code');
            
            const bChat = document.getElementById('tab-btn-chat');
            const bPrev = document.getElementById('tab-btn-preview');
            const bCode = document.getElementById('tab-btn-code');

            pChat.classList.add('hidden');
            pPrev.classList.add('hidden');
            pCode.classList.add('hidden');
            bChat.className = "flex-1 py-2 text-center font-medium text-slate-400 border-b-2 border-transparent";
            bPrev.className = "flex-1 py-2 text-center font-medium text-slate-400 border-b-2 border-transparent";
            bCode.className = "flex-1 py-2 text-center font-medium text-slate-400 border-b-2 border-transparent";

            if (tab === 'chat') {
                pChat.classList.remove('hidden');
                bChat.className = "flex-1 py-2 text-center font-medium bg-indigo-600/20 text-indigo-400 border-b-2 border-indigo-500";
            } else if (tab === 'preview') {
                pPrev.classList.remove('hidden');
                bPrev.className = "flex-1 py-2 text-center font-medium bg-indigo-600/20 text-indigo-400 border-b-2 border-indigo-500";
            } else if (tab === 'code') {
                pCode.classList.remove('hidden');
                bCode.className = "flex-1 py-2 text-center font-medium bg-indigo-600/20 text-indigo-400 border-b-2 border-indigo-500";
            }
        }

        async function generateApp() {
            const apiKey = localStorage.getItem('ai_key') || document.getElementById('api-key-input').value.trim();
            const provider = document.getElementById('provider-select').value;
            const input = document.getElementById('user-input');
            const text = input.value.trim();

            if(!apiKey) {
                alert('Por favor ingresa y guarda tu API Key.');
                return;
            }
            if(!text) return;

            const chatMessages = document.getElementById('chat-messages');
            const sendBtn = document.getElementById('send-btn');

            chatMessages.innerHTML += `
                <div class="flex items-start space-x-2 justify-end">
                    <div class="bg-indigo-600 text-white p-2.5 rounded-xl text-xs max-w-[85%]">${text}</div>
                </div>
            `;
            input.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;
            sendBtn.disabled = true;
            sendBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';

            try {
                let apiUrl = '';
                let requestBody = {};
                const systemPrompt = "Eres un desarrollador experto en HTML5 y Tailwind CSS. Crea una app web completa en un solo archivo. Devuelve ÚNICAMENTE el código HTML puro, con <!DOCTYPE html> y el script https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4. NO uses markdown (nada de ```html), ni texto extra.";

                if (provider === 'groq') {
                    apiUrl = '[https://api.groq.com/openai/v1/chat/completions](https://api.groq.com/openai/v1/chat/completions)';
                    requestBody = {
                        model: "llama-3.1-8b-instant",
                        messages: [
                            { role: "system", content: systemPrompt },
                            { role: "user", content: text }
                        ],
                        temperature: 0.7
                    };
                } else {
                    apiUrl = '[https://openrouter.ai/api/v1/chat/completions](https://openrouter.ai/api/v1/chat/completions)';
                    requestBody = {
                        model: "meta-llama/llama-3.1-8b-instruct:free",
                        messages: [
                            { role: "system", content: systemPrompt },
                            { role: "user", content: text }
                        ],
                        temperature: 0.7
                    };
                }

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify(requestBody)
                });

                if (!response.ok) {
                    throw new Error('Error en la API. Código: ' + response.status);
                }

                const data = await response.json();
                let generatedCode = data.choices[0].message.content;
                generatedCode = generatedCode.replace(/```html/gi, '').replace(/```/g, '').trim();

                chatMessages.innerHTML += `
                    <div class="flex items-start space-x-2">
                        <div class="w-6 h-6 rounded-full bg-indigo-600 flex items-center justify-center text-white shrink-0 text-[10px] font-bold">IA</div>
                        <div class="bg-slate-900 border border-slate-800 p-2.5 rounded-xl text-slate-300">
                            ¡Listo! App generada. Toca la pestaña <b>Previsualización</b> arriba para verla.
                        </div>
                    </div>
                `;
                chatMessages.scrollTop = chatMessages.scrollHeight;

                document.getElementById('preview-frame').srcdoc = generatedCode;
                document.getElementById('code-content').textContent = generatedCode;
                switchMainTab('preview');

            } catch (error) {
                alert('Error: ' + error.message);
            } finally {
                sendBtn.disabled = false;
                sendBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i>';
            }
        }
    </script>
</body>
</html>
